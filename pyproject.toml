[project]
name = "drift-backup"
version = "0.1.0"
description = "Smart, adaptive backup that waits for your computer to rest."
requires-python = ">=3.10"
dependencies = ["click>=8.1", "rich>=13.0", "psutil>=5.9"]

[project.scripts]
drift = "drift.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["drift"]
